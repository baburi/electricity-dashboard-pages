            font-size: 26px;
            font-weight: bold;
            color: #111827;
        }

        .card-value.small {
            font-size: 18px;
        }

        .chart-container {
            background: white;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        footer {
            padding: 24px 32px;
            color: #6b7280;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 700px) {
            header {
                padding: 20px;
            }

            main {
                padding: 16px;
            }

            .card-value {
                font-size: 22px;
            }
        }
